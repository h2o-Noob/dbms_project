<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relational Algebra Query Transformation</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Relational Algebra Transformation</h1>

        <h2>Enter Source Relational Algebra</h2>
        <textarea id="source_ra" rows="10" cols="50" placeholder="Enter Source Relational Algebra in JSON format"></textarea>

        <h2>Enter Target Relational Algebra</h2>
        <textarea id="target_ra" rows="10" cols="50" placeholder="Enter Target Relational Algebra in JSON format"></textarea>

        <button id="submit_button">Submit</button>

        <h2>Output</h2>
        <pre id="output"></pre>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
